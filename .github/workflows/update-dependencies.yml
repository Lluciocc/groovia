name: Update dependencies

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      manifest-artifact-id: ${{ steps.upload-manifests.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install updater dependencies
        run: python -m pip install packaging

      - name: Refresh pinned downloads
        run: python scripts/update_dependencies.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate JSON manifests
        run: |
          python -m json.tool io.github.Lluciocc.Groovia.json >/dev/null
          python -m json.tool packaging/windows/dependencies.json >/dev/null

      - name: Save updated manifests
        id: upload-manifests
        uses: actions/upload-artifact@v4
        with:
          name: updated-dependency-manifests
          path: |
            io.github.Lluciocc.Groovia.json
            packaging/windows/dependencies.json
          if-no-files-found: error

  validate-flatpak:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: updated-dependency-manifests
          path: .

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder

      - name: Install GNOME 50 SDK and runtime
        run: |
          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          flatpak install \
            --user \
            --noninteractive \
            --or-update \
            flathub \
            org.gnome.Sdk//50 \
            org.gnome.Platform//50

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --disable-rofiles-fuse \
            build-flatpak-ci \
            io.github.Lluciocc.Groovia.json

  validate-windows:
    needs: update
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      windows-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: updated-dependency-manifests
          path: .

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-scipy
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-imagemagick
            mingw-w64-ucrt-x86_64-adwaita-icon-theme

      - name: Build and smoke-test Windows package
        shell: msys2 {0}
        run: |
          ./packaging/windows/build-windows.sh \
            --skip-installer \
            --dont-open-dist

      - name: Upload tested Windows package
        id: upload-windows
        uses: actions/upload-artifact@v4
        with:
          name: groovia-windows-dependency-test
          path: dist/Groovia/
          if-no-files-found: error

  create-pull-request:
    needs:
      - update
      - validate-flatpak
      - validate-windows

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: updated-dependency-manifests
          path: .

      - name: Create dependency update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-dependencies
          delete-branch: true
          commit-message: "chore: update pinned dependencies"
          title: "chore: update pinned dependencies"
          body: |
            Automated weekly update of:

            - Flatpak NumPy and SciPy wheels for x86_64 and aarch64
            - Windows spotDL, Deno and pinned BtbN FFmpeg downloads
            - SHA-256 checksums and upstream license checksums

            Download the generated artifacts:

            - [Updated dependency manifests](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ needs.update.outputs.manifest-artifact-id }})
            - [Windows executable and bundled internals](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ needs.validate-windows.outputs.windows-artifact-id }})

            The GNOME 50 Flatpak build, Windows executable and bundled-tool
            smoke tests passed before this PR was opened. No installer was built.