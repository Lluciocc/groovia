[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "build",
    "build-flatpak",
    "dist",
    ".flatpak-builder",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
skip = [
    ".git",
    ".flatpak-builder",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
]

# commands
# ruff check --fix .
# ruff format .
# isort .